apiVersion: kubeadm.k8s.io/v1beta4
kind: InitConfiguration
localAPIEndpoint:
  advertiseAddress: 10.0.1.1
timeouts:
  controlPlaneComponentHealthCheck: 4m0s

---
apiVersion: kubeadm.k8s.io/v1beta4
kind: ClusterConfiguration
apiServer:
  extraArgs:
    - name: authorization-mode
      value: Node,RBAC
    - name: max-mutating-requests-inflight
      value: "200000"
    - name: max-requests-inflight
      value: "200000"
    - name: feature-gates
      value: AuthorizeNodeWithSelectors=false
certificatesDir: /etc/kubernetes/pki
clusterName: kubernetes
dns: {}
etcd:
  local:
    dataDir: /var/lib/etcd
    extraArgs:
      - name: listen-metrics-urls
        value: http://0.0.0.0:2381
      - name: quota-backend-bytes
        value: "16000000000"
imageRepository: registry.k8s.io
kubernetesVersion: v1.32.0
networking:
  dnsDomain: cluster.local
  podSubnet: 10.168.0.0/16
  serviceSubnet: 10.96.0.0/12
controllerManager:
  extraArgs:
    - name: bind-address
      value: 0.0.0.0
    - name: kube-api-qps
      value: "1000"
    - name: kube-api-burst
      value: "2000"
    - name: concurrent-deployment-syncs
      value: "100"
    - name: concurrent-endpoint-syncs
      value: "50"
    - name: concurrent-replicaset-syncs
      value: "100"
    - name: concurrent-service-endpoint-syncs
      value: "50"
    - name: endpoint-updates-batch-period
      value: 50ms
    - name: endpointslice-updates-batch-period
      value: 50ms
    - name: feature-gates
      value: TopologyAwareHints=false
scheduler:
  extraArgs:
    - name: bind-address
      value: 0.0.0.0

---
apiVersion: kubelet.config.k8s.io/v1beta1
kind: KubeletConfiguration
kubeAPIQPS: 50
kubeAPIBurst: 100
configMapAndSecretChangeDetectionStrategy: Watch

---
apiVersion: kubeproxy.config.k8s.io/v1alpha1
kind: KubeProxyConfiguration
metricsBindAddress: 0.0.0.0:10249
